name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read published conference slides
        uses: actions/checkout@v7
        with:
          ref: presentation-assets
          path: .published-presentations
          sparse-checkout: archive
          persist-credentials: false

      - name: Mount the archive at /presentation/
        run: |
          test -f .published-presentations/archive/index.html
          test ! -e public/presentation
          cp -R .published-presentations/archive public/presentation

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
